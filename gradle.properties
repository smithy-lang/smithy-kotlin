kotlin.code.style=official
kotlin.incremental.js=true
kotlin.incremental.multiplatform=true
kotlin.mpp.stability.nowarn=true
kotlin.mpp.enableCInteropCommonization=true
kotlin.native.ignoreDisabledTargets=true

# atomicfu
# FIXME - https://github.com/Kotlin/kotlinx-atomicfu/issues/274
kotlinx.atomicfu.enableJvmIrTransformation=false
kotlinx.atomicfu.enableNativeIrTransformation=false

# gradle
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G
org.gradle.parallel=true

# SDK
sdkVersion=1.7.14-SNAPSHOT

# codegen
codegenVersion=0.35.59-SNAPSHOT

# Use Dokka Gradle plugin V2 without the V1 migration helpers, which the default mode (V2EnabledWithHelpers) enables
org.jetbrains.dokka.experimental.gradle.pluginMode=V2Enabled
org.jetbrains.dokka.experimental.gradle.pluginMode.noWarn=true